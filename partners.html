<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logic Pursuits — Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --teal:      #00C8B7;
      --navy:      #003B5E;
      --deep-navy: #002B3C;
      --white:     #FFFFFF;
      --grey-200:  #E2E6EA;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      -webkit-font-smoothing: antialiased;
      height: 100%;
    }

    /* Centre the section vertically and horizontally */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 40px;
    }

    /* Reveal helper (already visible — no scroll needed) */
    .reveal { opacity: 1; }

    /* ── Partners section ───────────────────────────── */
    .partner-logos {
      width: 100vw;
      padding: 67px 0 0;
      background: var(--white);
    }

    .partner-logos__headline {
      font-size: 48px;
      font-weight: 200;
      font-family: 'Inter', sans-serif;
      letter-spacing: -0.01em;
      line-height: 1.2;
      color: var(--deep-navy);
      max-width: 100%;
      margin-bottom: 0;
      text-align: center;
    }
    .partner-logos__headline strong {
      font-weight: 700;
      font-family: 'Inter', sans-serif;
    }

    /* Mesh canvas area */
    .partners-mesh-wrap {
      position: relative;
      width: 100%;
      height: 378px;
      margin-top: 45px;
      cursor: crosshair;
      overflow: hidden;
    }

    #mesh-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Fade edges into white */
    .partners-mesh-wrap::before,
    .partners-mesh-wrap::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 100px;
      pointer-events: none;
      z-index: 2;
    }
    .partners-mesh-wrap::before {
      top: 0;
      background: linear-gradient(to bottom, var(--white) 0%, transparent 100%);
    }
    .partners-mesh-wrap::after {
      bottom: 0;
      background: linear-gradient(to top, var(--white) 0%, transparent 100%);
    }

    /* Logo pills */
    .partner-logo-pill {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 64px;
      padding: 0 24px;
      background: #fff;
      border: 1px solid rgba(0,59,94,0.12);
      border-radius: 0;
      box-shadow: 0 2px 12px rgba(0,59,94,0.08);
      z-index: 3;
      transition: border-color 0.18s ease-out, border-width 0.18s ease-out, transform 0.18s ease-out;
      will-change: transform;
    }
    .partner-logo-pill:hover {
      border-color: #00C8B7;
      border-width: 2px;
    }
    .partner-logo-pill img {
      width: auto;
      max-width: 160px;
      display: block;
      object-fit: contain;
    }

    /* ── Secondary partners grid ─────────────────────── */
    .secondary-partners {
      width: 100vw;
      padding: 40px 0 80px;
      background: var(--white);
    }

    .secondary-partners__inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0 40px;
    }

    .secondary-logos-box {
      border: 1px solid rgba(0,59,94,0.15);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
    }

    .secondary-logo-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 36px 24px;
      border-right: 1px solid rgba(0,59,94,0.15);
    }

    .secondary-logo-cell:last-child {
      border-right: none;
    }

    .secondary-logo-cell img {
      height: 32px;
      width: auto;
      max-width: 140px;
      object-fit: contain;
      display: block;
    }

    /* Mobile marquee — hidden on desktop */
    .secondary-mobile-marquee { display: none; }
    /* ── Mobile ─────────────────────────────────────── */
    @media (max-width: 768px) {
      .partner-logos { padding: 40px 0 0; }

      .partner-logos__headline { font-size: 32px; padding: 0 20px; }

      .partners-mesh-wrap { height: 580px; }

      .partner-logo-pill { height: 48px; padding: 0 12px; }

      /* Row 1: Striim (left) + Snowflake (right) */
      .pill-striim     { left: 4%  !important; top: 5%  !important; }
      .pill-striim     img { height: 22px !important; }
      .pill-snowflake  { left: 51% !important; top: 5%  !important; }
      .pill-snowflake  img { height: 22px !important; }

      /* Row 2: Databricks (center) */
      .pill-databricks { left: 28% !important; top: 21% !important; }
      .pill-databricks img { height: 18px !important; }

      /* Row 3: dbt Labs (left) + Matillion (right) */
      .pill-dbtlabs    { left: 4%  !important; top: 37% !important; }
      .pill-dbtlabs    img { height: 20px !important; }
      .pill-matillion  { left: 49% !important; top: 37% !important; }
      .pill-matillion  img { height: 21px !important; }

      /* Row 4: Glean (center) */
      .pill-glean      { left: 28% !important; top: 53% !important; }
      .pill-glean      img { height: 22px !important; }

      /* Row 5: OpenAI (left) + Anthropic (right) */
      .pill-openai     { left: 4%  !important; top: 69% !important; }
      .pill-openai     img { height: 22px !important; }
      .pill-anthropic  { left: 49% !important; top: 69% !important; }
      .pill-anthropic  img { height: 12px !important; }

      /* Row 6: Palantir (center) */
      .pill-palantir   { left: 28% !important; top: 84% !important; }
      .pill-palantir   img { height: 18px !important; }

      /* Secondary — swap to marquee on mobile */
      .secondary-partners { padding: 30px 0 50px; }
      .secondary-partners__inner { padding: 0; }
      .secondary-logos-box { display: none; }

      .secondary-mobile-marquee {
        display: block;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
        mask-image: linear-gradient(to right, transparent 0%, #000 8%, #000 92%, transparent 100%);
      }
      .secondary-mobile-track {
        display: flex;
        align-items: center;
        gap: 48px;
        width: max-content;
        animation: marquee 35s linear infinite;
        padding: 8px 0;
      }
      @keyframes marquee {
        0%   { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .secondary-mobile-track img {
        height: 24px;
        width: auto;
        object-fit: contain;
        flex-shrink: 0;
      }
    }
  </style>
</head>
<body>

  <section class="partner-logos" aria-labelledby="partners-headline">
    <div class="wrap">
      <h2 class="partner-logos__headline" id="partners-headline">
        Multiplying outcomes with <strong>our partners</strong>
      </h2>
    </div>

    <div class="partners-mesh-wrap" id="partners-mesh-wrap">
      <canvas id="mesh-canvas"></canvas>

      <!-- Row 1 — top -->
      <div class="partner-logo-pill pill-snowflake" style="left:3%;top:9%;" data-depth="1.3">
        <img src="Assets/Logo/New-logos-primary-partners/logo-snowflake.png" alt="Snowflake" style="height:30px">
      </div>
      <div class="partner-logo-pill pill-databricks" style="left:36%;top:13%;" data-depth="0.8">
        <img src="Assets/Logo/New-logos-primary-partners/logo-databricks.png" alt="Databricks" style="height:24px">
      </div>
      <div class="partner-logo-pill pill-dbtlabs" style="left:70%;top:10%;" data-depth="1.1">
        <img src="Assets/Logo/New-logos-primary-partners/logo-dbtLabs.png" alt="dbt Labs" style="height:26px">
      </div>

      <!-- Row 2 — middle -->
      <div class="partner-logo-pill pill-matillion" style="left:19%;top:40%;" data-depth="1.0">
        <img src="Assets/Logo/New-logos-primary-partners/logo-matillion.png" alt="Matillion" style="height:28px">
      </div>
      <div class="partner-logo-pill pill-striim" style="left:54%;top:41%;" data-depth="0.7">
        <img src="Assets/Logo/New-logos-primary-partners/logo-striim.png" alt="Striim" style="height:30px">
      </div>
      <div class="partner-logo-pill pill-glean" style="left:87%;top:37%;" data-depth="1.8">
        <img src="Assets/Logo/New-logos-primary-partners/logo-glean.png" alt="Glean" style="height:30px">
      </div>

      <!-- Row 3 — bottom -->
      <div class="partner-logo-pill pill-anthropic" style="left:4%;top:71%;" data-depth="0.9">
        <img src="Assets/Logo/New-logos-primary-partners/logo-anthropic.png" alt="Anthropic" style="height:16px">
      </div>
      <div class="partner-logo-pill pill-openai" style="left:39%;top:71%;" data-depth="1.6">
        <img src="Assets/Logo/New-logos-primary-partners/logo-openAI.png" alt="OpenAI" style="height:30px">
      </div>
      <div class="partner-logo-pill pill-palantir" style="left:72%;top:68%;" data-depth="1.4">
        <img src="Assets/Logo/New-logos-primary-partners/logo- palantir.png" alt="Palantir" style="height:24px">
      </div>

    </div>
  </section>

  <section class="secondary-partners">
    <div class="secondary-partners__inner">
      <!-- Desktop: static grid -->
      <div class="secondary-logos-box">
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-SAP.png" alt="SAP"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-atlan.png" alt="Atlan"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-aws.png" alt="AWS"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-azure.png" alt="Azure"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-powerBL.png" alt="Power BI"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-redpoint.png" alt="Redpoint"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-salesforce.png" alt="Salesforce"></div>
        <div class="secondary-logo-cell"><img src="Assets/Logo/new-logo-secondary-partners/logo-tableau.png" alt="Tableau"></div>
      </div>
      <!-- Mobile: marquee scroll -->
      <div class="secondary-mobile-marquee">
        <div class="secondary-mobile-track">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-SAP.png" alt="SAP">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-atlan.png" alt="Atlan">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-aws.png" alt="AWS">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-azure.png" alt="Azure">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-powerBL.png" alt="Power BI">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-redpoint.png" alt="Redpoint">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-salesforce.png" alt="Salesforce">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-tableau.png" alt="Tableau">
          <!-- duplicate for seamless loop -->
          <img src="Assets/Logo/new-logo-secondary-partners/logo-SAP.png" alt="SAP">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-atlan.png" alt="Atlan">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-aws.png" alt="AWS">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-azure.png" alt="Azure">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-powerBL.png" alt="Power BI">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-redpoint.png" alt="Redpoint">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-salesforce.png" alt="Salesforce">
          <img src="Assets/Logo/new-logo-secondary-partners/logo-tableau.png" alt="Tableau">
        </div>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var wrap   = document.getElementById('partners-mesh-wrap');
      var canvas = document.getElementById('mesh-canvas');
      if (!wrap || !canvas) return;

      var ctx   = canvas.getContext('2d');
      var mouse = { x: -9999, y: -9999, active: false };
      var nodes = [];
      var W = 0, H = 0;
      var COLS = 26, ROWS = 10;

      function buildNodes() {
        nodes = [];
        for (var r = 0; r <= ROWS; r++) {
          for (var c = 0; c <= COLS; c++) {
            var ox = (c / COLS) * W;
            var oy = (r / ROWS) * H;
            nodes.push({ ox: ox, oy: oy, x: ox, y: oy, vx: 0, vy: 0, c: c, r: r });
          }
        }
      }

      function n(c, r) { return nodes[r * (COLS + 1) + c]; }

      function resize() {
        W = canvas.width  = wrap.offsetWidth;
        H = canvas.height = wrap.offsetHeight;
        buildNodes();
      }

      var PULL_R  = 200;
      var PULL_S  = 0.38;
      var SPRING  = 0.055;
      var DAMPING = 0.76;

      function update() {
        for (var i = 0; i < nodes.length; i++) {
          var nd = nodes[i];
          var dx = mouse.x - nd.ox;
          var dy = mouse.y - nd.oy;
          var dist = Math.sqrt(dx * dx + dy * dy);
          var tx = nd.ox, ty = nd.oy;

          if (mouse.active && dist < PULL_R) {
            var f = (1 - dist / PULL_R);
            f = f * f;
            tx = nd.ox + dx * f * PULL_S;
            ty = nd.oy + dy * f * PULL_S;
          }

          nd.vx += (tx - nd.x) * SPRING;
          nd.vy += (ty - nd.y) * SPRING;
          nd.vx *= DAMPING;
          nd.vy *= DAMPING;
          nd.x  += nd.vx;
          nd.y  += nd.vy;
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);

        for (var r = 0; r <= ROWS; r++) {
          for (var c = 0; c <= COLS; c++) {
            var nd = n(c, r);
            var dx = mouse.x - nd.x;
            var dy = mouse.y - nd.y;
            var d  = Math.sqrt(dx * dx + dy * dy);
            var glow = mouse.active ? Math.max(0, 1 - d / 140) : 0;

            /* horizontal line */
            if (c < COLS) {
              var nr = n(c + 1, r);
              ctx.beginPath();
              ctx.moveTo(nd.x, nd.y);
              ctx.lineTo(nr.x, nr.y);
              var a1 = glow > 0 ? (0.12 + glow * 0.60) : 0.10;
              ctx.strokeStyle = glow > 0 ? 'rgba(0,200,183,' + a1 + ')' : 'rgba(0,59,94,' + a1 + ')';
              ctx.lineWidth = 0.5 + glow * 1.2;
              ctx.stroke();
            }
            /* vertical line */
            if (r < ROWS) {
              var nb = n(c, r + 1);
              ctx.beginPath();
              ctx.moveTo(nd.x, nd.y);
              ctx.lineTo(nb.x, nb.y);
              var a2 = glow > 0 ? (0.12 + glow * 0.60) : 0.10;
              ctx.strokeStyle = glow > 0 ? 'rgba(0,200,183,' + a2 + ')' : 'rgba(0,59,94,' + a2 + ')';
              ctx.lineWidth = 0.5 + glow * 1.2;
              ctx.stroke();
            }
            /* node dot */
            var ns = glow > 0.35 ? 2.2 : 1;
            ctx.fillStyle = glow > 0.2
              ? 'rgba(0,200,183,' + (0.60 + glow * 0.40) + ')'
              : 'rgba(0,59,94,0.18)';
            ctx.fillRect(nd.x - ns, nd.y - ns, ns * 2, ns * 2);
          }
        }
      }

      function loop() { update(); draw(); requestAnimationFrame(loop); }

      /* Mouse tracking */
      wrap.addEventListener('mousemove', function (e) {
        var rect = wrap.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
        mouse.active = true;
      });
      wrap.addEventListener('mouseleave', function () { mouse.active = false; });

      /* Logo parallax */
      var pills = wrap.querySelectorAll('.partner-logo-pill');
      wrap.addEventListener('mousemove', function (e) {
        var rect = wrap.getBoundingClientRect();
        var rx = ((e.clientX - rect.left) / rect.width  - 0.5) * 2;
        var ry = ((e.clientY - rect.top)  / rect.height - 0.5) * 2;
        pills.forEach(function (pill) {
          var depth = parseFloat(pill.dataset.depth) || 1;
          pill.style.transform = 'translate(' + (rx * depth * -14) + 'px,' + (ry * depth * -9) + 'px)';
        });
      });
      wrap.addEventListener('mouseleave', function () {
        pills.forEach(function (pill) { pill.style.transform = 'translate(0,0)'; });
      });

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(resize, 120);
      });

      resize();
      loop();
    })();
  </script>

</body>
</html>
